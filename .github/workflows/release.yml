name: Release

# Runs when a release is published on GitHub. It builds FogLaunch.exe and
# FogLaunch-source.zip (what copies without git update from) from exactly the
# tagged source, attaches both with their SHA-256, and records a build
# attestation that anyone can check with:
#   gh attestation verify FogLaunch.exe --repo senisinx/Fog-Launch

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: The tag matches the version in the code
        shell: bash
        run: |
          version=$(python -c "import fog_launch; print(fog_launch.__version__)")
          if [ "v$version" != "$TAG" ]; then
            echo "The tag $TAG does not match fog_launch/__init__.py ($version)."
            exit 1
          fi
      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v
      - name: Build FogLaunch.exe
        run: |
          python -m pip install pyinstaller==6.11.1
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FogLaunch --icon fog_launch/assets/icon.ico --add-data "fog_launch/assets;fog_launch/assets" fog_launch.pyw
      - name: Source ZIP
        shell: bash
        # The folder inside is dropped by fog_launch/update.py (apply_zip), like GitHub's own archive.
        run: git archive --format=zip --prefix="Fog-Launch-$TAG/" -o dist/FogLaunch-source.zip HEAD
      - name: Checksum
        shell: bash
        run: |
          cd dist
          sha256sum FogLaunch.exe FogLaunch-source.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Build attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/FogLaunch.exe
            dist/FogLaunch-source.zip
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/FogLaunch.exe dist/FogLaunch-source.zip dist/SHA256SUMS.txt --clobber
