name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install pyflakes==4.1.0
      - run: python -m pyflakes fog_launch tests get_legendary.py fog_launch.pyw

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # 3.11 is the oldest the README promises, 3.12 builds the release exe, 3.13 is the newest.
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t . -v
      - name: Run the tests (with a virtual display for the window test)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -t . -v
